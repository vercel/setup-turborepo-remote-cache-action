name: 'Setup Turborepo Remote Cache'
description: 'Exchange a GitHub OIDC token for a Turborepo CLI access token.'
author: 'Vercel'
branding:
  icon: 'key'
  color: 'black'

inputs:
  team:
    description: 'Vercel team ID or slug (e.g., "team_123…" or "my-team")'
    required: true
  audience:
    description: "Custom audience to use (must match your Vercel team's OIDC policy)"
    required: false
  policy:
    description: "OIDC policy ID to use (disambiguates when more than one of your team's policies could match the OIDC token)"
    required: false

runs:
  using: composite
  steps:
    - name: Exchange GitHub OIDC token for Vercel access token
      shell: bash
      env:
        TURBO_APP_ID: cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD
        TURBO_TEAM: ${{ inputs.team }}
        AUDIENCE: ${{ inputs.audience }}
        POLICY_ID: ${{ inputs.policy }}
      run: |
        set -euo pipefail

        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "::error::OIDC environment variables are missing. The calling job needs \"permissions: id-token: write\"."
          exit 1
        fi

        # Suitable for the two responses below (GitHub OIDC, Vercel token
        # exchange) where the value cannot contain escaped quotes.
        json_field() {
          tr -d '\n\r\t' | sed -nE "s/.*\"$1\" *: *\"([^\"]*)\".*/\1/p"
        }

        audience_args=()
        if [[ -n "${AUDIENCE:-}" ]]; then
          audience_args=(--data-urlencode "audience=$AUDIENCE")
        fi

        oidc_token=$(curl -sS -f -G \
          --retry 3 --retry-connrefused --max-time 30 \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          ${audience_args[@]+"${audience_args[@]}"} \
          "$ACTIONS_ID_TOKEN_REQUEST_URL" \
          | json_field value)
        if [[ -z "$oidc_token" || "$oidc_token" == "null" ]]; then
          echo "::error::Failed to obtain GitHub OIDC ID token"
          exit 1
        fi
        echo "::add-mask::$oidc_token"

        policy_args=()
        if [[ -n "${POLICY_ID:-}" ]]; then
          policy_args=(--data-urlencode "policy_id=$POLICY_ID")
        fi

        access_token=$(curl -sS -f -X POST https://api.vercel.com/login/oauth/token \
          --retry 3 --retry-connrefused --max-time 30 \
          --data "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
          --data "client_id=$TURBO_APP_ID" \
          --data "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
          --data "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
          --data-urlencode "team_id_or_slug=$TURBO_TEAM" \
          ${policy_args[@]+"${policy_args[@]}"} \
          --data-urlencode "subject_token=$oidc_token" \
          | json_field access_token)
        if [[ -z "$access_token" || "$access_token" == "null" ]]; then
          echo "::error::Failed to exchange OIDC token for Vercel access token"
          exit 1
        fi
        echo "::add-mask::$access_token"

        echo "TURBO_TOKEN=$access_token" >> "$GITHUB_ENV"
        echo "TURBO_TEAM=$TURBO_TEAM" >> "$GITHUB_ENV"
