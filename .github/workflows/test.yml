name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  end-to-end:
    name: End-to-End
    runs-on: ubuntu-latest
    # Forks don't get id-token: write on PRs; skip there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == github.event.pull_request.base.repo.owner.login
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          team-id: ${{ vars.TEAM_ID }}
      - name: Verify env exported
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TURBO_TOKEN:-}" ]]; then
            echo "::error::TURBO_TOKEN was not set"
            exit 1
          fi
          if [[ "${TURBO_TEAM:-}" != "${{ vars.TEAM_ID }}" ]]; then
            echo "::error::TURBO_TEAM mismatch"
            exit 1
          fi
